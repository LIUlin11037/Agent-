<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minimal Agent</title>
<style>
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --line: #e4e3de;
    --text: #23231f;
    --muted: #7a7973;
    --accent: #185fa5;
    --accent-soft: #e6f1fb;
    --tool: #0f6e56;
    --tool-soft: #e1f5ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  aside {
    width: 268px;
    flex: 0 0 268px;
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex;
    flex-direction: column;
  }
  .brand {
    padding: 18px 18px 12px;
    font-weight: 500;
    font-size: 15px;
  }
  .brand small {
    display: block;
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
    margin-top: 2px;
  }
  .user-row {
    padding: 0 14px 10px;
    display: flex;
    gap: 6px;
  }
  .user-row input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 12px;
    color: var(--text);
    background: var(--bg);
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    transition: background .15s, border-color .15s;
  }
  button:hover { background: var(--bg); border-color: #cfcec8; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: #134d87; }
  .new-btn { margin: 0 14px 10px; }
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 12px;
  }
  .item {
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 2px;
  }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--accent-soft); }
  .item .t {
    font-size: 13px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item .m { font-size: 11px; color: var(--muted); }
  .side-foot {
    border-top: 1px solid var(--line);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--muted);
  }
  main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  header {
    height: 52px;
    flex: 0 0 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .title { font-weight: 500; font-size: 14px; }
  header .title span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .msgs {
    flex: 1;
    overflow-y: auto;
    padding: 22px 0 8px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  .msg { margin-bottom: 18px; display: flex; flex-direction: column; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 84%;
    padding: 10px 13px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble { background: var(--accent-soft); }
  .assistant .bubble { background: var(--panel); border: 1px solid var(--line); }
  .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--tool-soft);
    color: var(--tool);
    border: 1px solid #c8e8dd;
  }
  .chip.bad { background: #fcebeb; color: #a32d2d; border-color: #f2c9c9; }
  .composer {
    border-top: 1px solid var(--line);
    background: var(--panel);
    padding: 12px 0 16px;
  }
  .composer .row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
    max-height: 160px;
  }
  textarea:focus { border-color: #b9cfe4; background: #fff; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 400px;
    background: var(--panel);
    border-left: 1px solid var(--line);
    transform: translateX(100%);
    transition: transform .2s ease;
    display: flex;
    flex-direction: column;
    z-index: 20;
  }
  .drawer.open { transform: translateX(0); }
  .drawer header { border-bottom: 1px solid var(--line); }
  .drawer .body { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 12px; }
  .ev { padding: 5px 0; border-bottom: 1px dashed #eeece6; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .ev b { color: var(--accent); font-weight: 500; }
  .ev .d { color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 13px; }
  .spinner { color: var(--muted); font-size: 12px; padding: 4px 2px; }
</style>
</head>
<body>
<aside>
  <div class="brand">Minimal Agent<small>自实现 Runtime · 多会话隔离</small></div>
  <div class="user-row">
    <input id="userId" value="user_a" title="用户 id" />
    <button id="reloadBtn" title="按该用户刷新">切换</button>
  </div>
  <button class="new-btn" id="newBtn">+ 新建窗口</button>
  <div class="list" id="sessionList"></div>
  <div class="side-foot" id="sideFoot">待办与窗口按用户隔离</div>
</aside>

<main>
  <header>
    <div class="title" id="title">未选择会话</div>
    <div>
      <button id="traceBtn">执行轨迹</button>
    </div>
  </header>
  <div class="msgs" id="msgs"><div class="empty">选择左侧窗口，或新建一个开始对话</div></div>
  <div class="composer">
    <div class="wrap">
      <div class="row">
        <textarea id="input" rows="1" placeholder="试试：北京天气怎么样？ / 记一下周五交周报 / 帮我算 (23*7+11)/4"></textarea>
        <button class="primary" id="sendBtn">发送</button>
      </div>
      <div class="hint">Enter 发送，Shift+Enter 换行。会话互相独立，切回去可以接着聊。</div>
    </div>
  </div>
</main>

<div class="drawer" id="drawer">
  <header>
    <div class="title">执行轨迹 <span id="traceCount"></span></div>
    <button id="closeDrawer">关闭</button>
  </header>
  <div class="body" id="traceBody"></div>
</div>

<script>
const state = { userId: "user_a", sessionId: null, sessions: [], busy: false };

const $ = (id) => document.getElementById(id);
const listEl = $("sessionList"), msgsEl = $("msgs"), inputEl = $("input");

function esc(text) {
  return String(text ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function api(path, options) {
  const resp = await fetch(path, options);
  if (!resp.ok) {
    let detail = resp.statusText;
    try { detail = (await resp.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return resp.json();
}

function renderSessions() {
  listEl.innerHTML = "";
  if (!state.sessions.length) {
    listEl.innerHTML = '<div class="empty">还没有窗口</div>';
    return;
  }
  state.sessions.forEach((s) => {
    const el = document.createElement("div");
    el.className = "item" + (s.id === state.sessionId ? " active" : "");
    el.innerHTML = `<div class="t">${esc(s.title || "(无标题)")}</div>
      <div class="m">${s.message_count} 条消息 · ${s.has_summary ? "已压缩" : "原文"}</div>`;
    el.onclick = () => selectSession(s.id);
    listEl.appendChild(el);
  });
}

function renderMessages(messages) {
  msgsEl.innerHTML = "";
  if (!messages.length) {
    msgsEl.innerHTML = '<div class="empty">空会话，发一句话开始</div>';
    return;
  }
  messages.forEach((m) => {
    if (m.role === "tool" || m.role === "system") return;
    const div = document.createElement("div");
    div.className = "msg " + (m.role === "user" ? "user" : "assistant");
    const chips = (m.tool_calls || []).filter(Boolean)
      .map((n) => `<span class="chip">${esc(n)}</span>`).join("");
    div.innerHTML = `<div class="who">${m.role === "user" ? "你" : "助手"}</div>
      <div class="bubble">${esc(m.content)}</div>
      ${chips ? `<div class="tools">${chips}</div>` : ""}`;
    msgsEl.appendChild(div);
  });
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function appendBubble(role, text, tools) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : "assistant");
  const chips = (tools || []).map((t) =>
    `<span class="chip ${t.ok ? "" : "bad"}">${esc(t.name)}</span>`).join("");
  div.innerHTML = `<div class="who">${role === "user" ? "你" : "助手"}</div>
    <div class="bubble">${esc(text)}</div>${chips ? `<div class="tools">${chips}</div>` : ""}`;
  msgsEl.appendChild(div);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return div;
}

async function loadSessions() {
  state.userId = $("userId").value.trim() || "user_a";
  state.sessions = await api(`/api/sessions?user_id=${encodeURIComponent(state.userId)}`);
  if (!state.sessionId && state.sessions.length) state.sessionId = state.sessions[0].id;
  renderSessions();
  if (state.sessionId) await selectSession(state.sessionId);
}

async function selectSession(id) {
  state.sessionId = id;
  renderSessions();
  const session = state.sessions.find((s) => s.id === id);
  $("title").innerHTML = `${esc(session ? session.title || "(无标题)" : id)}<span>${esc(id)}</span>`;
  const messages = await api(`/api/sessions/${encodeURIComponent(id)}/messages`);
  renderMessages(messages);
}

async function createSession() {
  const session = await api("/api/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: state.userId, title: "新窗口" }),
  });
  state.sessionId = session.id;
  await loadSessions();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || state.busy) return;
  if (!state.sessionId) await createSession();
  state.busy = true;
  $("sendBtn").disabled = true;
  inputEl.value = "";
  inputEl.style.height = "auto";
  appendBubble("user", text);
  const pending = appendBubble("assistant", "思考中…");

  try {
    const result = await api("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: state.userId, session_id: state.sessionId, message: text }),
    });
    pending.remove();
    appendBubble("assistant", result.reply, result.tool_calls);
    if (!state.sessions.find((s) => s.id === result.session_id)) state.sessionId = result.session_id;
    await loadSessions();
  } catch (err) {
    pending.remove();
    appendBubble("assistant", "出错了：" + err.message);
  } finally {
    state.busy = false;
    $("sendBtn").disabled = false;
    inputEl.focus();
  }
}

async function openTrace() {
  if (!state.sessionId) return;
  const records = await api(`/api/sessions/${encodeURIComponent(state.sessionId)}/trace?limit=80`);
  $("traceCount").textContent = records.length ? `${records.length} 条` : "";
  $("traceBody").innerHTML = records.length
    ? records.map((r) => {
        const detail = Object.entries(r)
          .filter(([k]) => !["ts", "epoch", "session", "turn", "step", "event"].includes(k))
          .filter(([, v]) => v !== null && v !== "" && !(Array.isArray(v) && !v.length))
          .map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`)
          .join(" ");
        return `<div class="ev"><b>${esc(r.event)}</b> <span class="d">${esc(r.ts.slice(11))} ${esc(detail).slice(0, 220)}</span></div>`;
      }).join("")
    : '<div class="empty">还没有轨迹</div>';
  $("drawer").classList.add("open");
}

$("newBtn").onclick = createSession;
$("reloadBtn").onclick = () => { state.sessionId = null; loadSessions(); };
$("sendBtn").onclick = send;
$("traceBtn").onclick = openTrace;
$("closeDrawer").onclick = () => $("drawer").classList.remove("open");

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
});

loadSessions().catch((err) => {
  msgsEl.innerHTML = `<div class="empty">加载失败：${esc(err.message)}<br/>请确认已配置 .env 中的 DEEPSEEK_API_KEY</div>`;
});
</script>
</body>
</html>
